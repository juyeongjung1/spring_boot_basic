<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--演習5.2
f. <html>の属性を修正してください。-->
	
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>人事管理システム</title>
	<link rel="stylesheet" th:href="@{/css/main_style.css}" />
</head>

<body>
	
<!--演習5.2 g. <body>以下のコードを<main>要素で囲って、layout:fragment属性を付与してください。-->
	
	<h1>社員情報</h1>
	<table>
		<tr>
			<th>社員番号</th>
			<th>社員名</th>
			<th>給与</th>
		</tr>
		<tr>
			<td th:text="${emp.id}"></td>
			<td th:text="${emp.name}"></td>
			<td th:text="${emp.salary}"></td>
		</tr>
	</table>

	<hr>
	<h3>社員削除</h3>

	<form th:action="@{/emp/delete/}+${emp.id}">
		<input type="submit" value="削除" style = "background-color: red;">
	</form>

	<!--ここまで</main>で囲ってください。 -->
</body>

</html>

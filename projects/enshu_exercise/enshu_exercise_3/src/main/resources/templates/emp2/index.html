<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>人事管理システム</title>
</head>

<body>
	<h1>人事管理システム</h1>
	<h2>社員検索</h2>

	<!--演習3.2で使用-->
	<p><a th:href="@{/emp2/findAll}">全社員一覧</a></p>

	<!--演習3.3で使用-->
	<form th:action="@{/emp2/showFindById}">
		<h3>社員番号で検索</h3>
		<input type="number" name="id">
		<input type="submit" value="検索">
	</form>

	<!--演習3.4で使用-->
	<form th:action="@{/emp2/showFindBySalary}">
		<h3>給与で検索</h3>
		<input type="number" name="salary">
		<input type="submit" value="検索">
	</form>

	<!--演習3.4で使用-->
	<form th:action="@{/emp2/showFindByName}">
		<h3>名前で検索</h3>
		<input type="text" name="name">
		<input type="submit" value="検索">
	</form>

	<!--演習3.6で使用-->
	<p><a th:href="@{/emp2/showInputView}">社員データ登録</a></p>

</body>

</html>

<body>
    <h1>人事管理システム</h1>
    <h2>社員検索</h2>
    
    <div class="dropdown">
  	<button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
    	メニュー
  	</button>
	  <ul class="dropdown-menu">
		<li><a class="dropdown-item" th:href="@{/findAll}">全社員一覧</a></li>

	  </ul>
	</div>

    
    <form th:action="@{/showFindById}">
		<h3>社員番号で検索</h3>
		<input type = "number" name = "id">
		<input type = "submit" value = "検索">
	</form>
	
	<form th:action="@{/showFindByIdSafe}">
		<h3>社員番号で検索2</h3>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Insert title here</title>
</head>

<body>
	<h1>商品情報修正</h1>
	<form th:action = "@{/product/update}" method = "POST">
		<!--th:value属性を使い、id, name, priceのフォームに既存の値を入れてください-->
	<p>商品番号：<input type = "text" name = "id"         readonly></input></p>
	<p>商品名　：<input type = "text" name = "name"        ></p>
	<p>商品価格：<input type = "text" name = "price"       ></p>
	<input type = "submit" value = "修正">
	</form>
</body>

</html>

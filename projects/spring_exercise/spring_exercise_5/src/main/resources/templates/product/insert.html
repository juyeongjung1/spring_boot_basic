<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"

  >                                    
<!--xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
       layout:decorate="~{layout}" をhtmlの属性に追加してください。 -->

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Insert title here</title>
</head>

<body>
	<!-- ここから、<main>タグで</form>まで囲ってください。
	属性には、layout.htmlのmain部分の属性値を確認し、
	layout:fragment="main_content"を入れてください-->
	
	<h1>商品登録</h1>
	<form action = "insert" method = "POST">
	<p>商品番号：(自動割り当て)</p>
	<p>商品名　：<input type = "text" name = "name"></p>
	<p>商品価格：<input type = "text" name = "price"></p>
	<input type = "submit" value = "登録">
	</form>
	
	<!--ここまで囲ってください。-->
</body>

</html>

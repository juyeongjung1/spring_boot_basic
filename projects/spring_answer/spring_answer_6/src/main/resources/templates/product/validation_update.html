<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品情報修正</title>
    <style>.error { color: #a1261e; }</style>
</head>
<body>
    <h1>商品情報修正</h1>

    <form th:action="@{/product/validation/update}"
          th:object="${productForm}" method="post">
        <p>
            <label for="id">商品番号</label>
            <input type="text" th:field="*{id}" readonly>
            <span class="error" th:errors="*{id}"></span>
        </p>
        <p>
            <label for="name">商品名</label>
            <input type="text" th:field="*{name}">
            <span class="error" th:errors="*{name}"></span>
        </p>
        <p>
            <label for="price">商品価格</label>
            <input type="text" th:field="*{price}">
            <span class="error" th:errors="*{price}"></span>
        </p>
        <p>
            <label>カテゴリ
                <select th:field="*{categoryId}">
                    <option value="">選択してください</option>
                    <option th:each="category : ${categories}"
                            th:value="${category.id}"
                            th:text="${category.name}"></option>
                </select>
            </label>
            <span class="error" th:errors="*{categoryId}"></span>
        </p>
        <button type="submit">保存</button>
    </form>
    <a th:href="@{/product/findAll}">商品一覧へ</a>
</body>
</html>

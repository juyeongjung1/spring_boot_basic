<!doctype html><html lang="ja"><meta charset="utf-8"><title>front 教材部品プレビュー</title><style>/* HTMLプレビューと印刷PDFで共通の教材カード。 */
@page { margin: 0; }

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: #fff;
  color: #202833;
  font: 10.5pt/1.5 "MS PGothic", "Meiryo", sans-serif;
  font-variant-ligatures: none;
  font-kerning: none;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

.card {
  width: 100%;
  margin: 0;
  border: 0.6pt solid #d7dde5;
  border-radius: 6pt;
  background: #fff;
  overflow: hidden;
}

.card-header {
  display: flex;
  align-items: flex-start;
  gap: 6pt;
  padding: 8pt 10pt;
  border-bottom: 0.6pt solid #d7dde5;
  background: #f2f5f8;
  font-weight: 700;
  line-height: 1.4;
}

.card-header .badge,
.card-header .language-badge {
  flex: 0 1 auto;
  max-width: 40%;
  padding: 2pt 5pt;
  border: 0.6pt solid #d7dde5;
  border-radius: 3pt;
  background: #fff;
  color: #374151;
  font-size: 9.5pt;
  font-weight: 700;
  overflow-wrap: anywhere;
}

.card-header .filename {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 2pt;
  flex: 1 1 0;
  min-width: 0;
  text-align: right;
  color: #123d68;
  font-family: "Meiryo", sans-serif;
  font-size: 10.5pt;
  font-weight: 700;
  overflow-wrap: anywhere;
}

.card-header .file-item {
  min-width: 0;
  max-width: 100%;
  padding: 1pt 4pt;
  border: 0.6pt solid #adc5dd;
  border-radius: 3pt;
  background: #e8f1fb;
  text-decoration: underline;
  text-decoration-thickness: 0.8pt;
  text-underline-offset: 1.5pt;
}

.card-header .continuation {
  flex: 0 0 auto;
  color: #4b5563;
  font-size: 9.5pt;
  font-weight: 700;
}

.continuation:empty,
.card-footer:empty {
  display: none;
}

.card-content {
  min-width: 0;
  padding: 8pt 10pt;
}

.code-card .card-content {
  padding: 6pt 0;
}

.code-row {
  display: grid;
  grid-template-columns: 34pt minmax(0, 1fr);
  align-items: start;
  break-inside: avoid;
}

.line-number {
  padding: 0 7pt 0 4pt;
  border-right: 0.6pt solid #e5e9ef;
  color: #6b7280;
  font: 9.5pt/15.5pt Consolas, "MS Gothic", monospace;
  text-align: right;
  white-space: nowrap;
}

pre.source-code {
  min-width: 0;
  margin: 0;
  padding: 0 9pt;
  color: #202833;
  font: 10.5pt/15.5pt Consolas, "MS Gothic", monospace;
  tab-size: 4;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.source-code .keyword { color: #6333a6; font-weight: 700; }
.source-code .string { color: #a33124; }
.source-code .number { color: #18568b; }
.source-code .type { color: #176a69; }
.source-code .function { color: #245b9d; }
.source-code .operator,
.source-code .punctuation { color: #374151; }

.code-card .comment,
.code-card .comment *,
.explanation-card .comment,
.explanation-card .comment * {
  color: #008000 !important;
  opacity: 1 !important;
  font-style: normal !important;
}

.table-card .card-content,
.explanation-card .card-content {
  padding: 0;
}

.card table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  font-size: 10.5pt;
  line-height: 1.5;
}

.card thead { display: table-header-group; }
.card tbody { display: table-row-group; }
.card tr { break-inside: avoid; }

.card th,
.card td {
  padding: 6pt 7pt;
  border: 0.6pt solid #d7dde5;
  text-align: left;
  vertical-align: top;
  overflow-wrap: anywhere;
}

.card th {
  background: #edf2f7;
  font-weight: 700;
}

.table-card table { font-size: 9.5pt; }
.table-card th,
.table-card td { padding: 5pt; }

.card tbody tr:nth-child(even) {
  background: #f8fafc;
}

.explanation-table th:nth-child(1) { width: 14%; }
.explanation-table th:nth-child(2) { width: 36%; }
.explanation-table th:nth-child(3) { width: 50%; }
.explanation-table pre.source-code { padding: 0; font-size: 9.5pt; line-height: 14.5pt; }
.explanation-table .line-label { font-size: 9.5pt; }

.card td p,
.card th p {
  margin: 0 0 5pt;
}

.card td p:last-child,
.card th p:last-child { margin-bottom: 0; }

/* .source-style の色・書体・強調は原稿側の指定をそのまま使う。 */
.card-footer {
  padding: 7pt 10pt;
  border-top: 0.6pt solid #d7dde5;
  background: #fff;
  color: #374151;
  font-size: 9.5pt;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

@media print {
  .card {
    box-shadow: none;
    break-inside: avoid;
  }
}
body{padding:24px;background:#eef2f6}article{margin:0 auto 28px;width:max-content;max-width:100%}.preview-id{font:12px sans-serif;color:#475569}</style><body></body></html>
